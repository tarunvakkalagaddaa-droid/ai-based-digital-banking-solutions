<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI Digital Bank{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="{{ url_for('index') }}">AI Digital Bank</a>
    {% if session.user_id %}
      <div class="links">
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('transfer') }}">Transfer</a>
        <a href="{{ url_for('history') }}">History</a>
        <a href="{{ url_for('loan') }}">Loan</a>
        <a href="{{ url_for('chatbot') }}">Assistant</a>
        <a href="{{ url_for('logout') }}">Logout ({{ session.name }})</a>
      </div>
    {% endif %}
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
